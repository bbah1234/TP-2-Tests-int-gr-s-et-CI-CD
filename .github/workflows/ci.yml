name: CI–FastAPI

on:
  pull_request:
    branches: [main]

  push:
    branches: [develop]

permissions:
  contents: read

jobs:

  security:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dependency security
        run: |
          pip install safety
          safety check || true


  test:
    needs: security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          export PYTHONPATH=$(pwd)
          pytest --cov=. --maxfail=1 --disable-warnings -q

